name: Elecrow Daily Check-in

on:
  schedule:
    - cron: '0 9 * * *'  # runs daily at 9:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Run daily check-in
        env:
          ELECROW_EMAIL: ${{ secrets.ELECROW_EMAIL }}
          ELECROW_PASSWORD: ${{ secrets.ELECROW_PASSWORD }}
        run: |
          python elecrow_checkin.py --scheduled

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-logs
          path: |
            checkin_log.txt
            checkin_result.png
